name: Build & Release Firmware [Pre-Release]

on:
  release:
    types: [prereleased]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: 'recursive'
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.14.0'
    - name: Build web dist
      working-directory: ./main/http_server/axe-os
      run: |
        npm ci
        npm run build
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
      with:
        esp_idf_version: v6.0.2
        target: esp32s3
        command: GITHUB_ACTIONS="true" idf.py build
        path: '.'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install esptool
    - name: "Create factory/merged image"
      run: "./merge_bin.sh ./esp-miner-merged.bin"
    - name: upload esp-miner-merged.bin
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: esp-miner-factory.bin
        path: ./esp-miner-merged.bin
    - name: upload esp-miner.bin
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: esp-miner.bin
        path: ./build/esp-miner.bin

    - name: Release esp-miner.bin
      uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        prerelease: true
        files: ./build/esp-miner.bin
